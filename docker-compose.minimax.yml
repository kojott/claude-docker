services:
  claude-minimax:
    build: .
    image: ghcr.io/kojott/claude-docker:latest
    container_name: ${CONTAINER_NAME:-claude-minimax}
    hostname: ${CONTAINER_NAME:-claude-minimax}
    stdin_open: true
    tty: true
    env_file: .env.minimax
    environment:
      - GIT_USER_NAME=${GIT_USER_NAME:-Claude Dev}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-dev@localhost}
      - CLAUDE_AUTOSTART=${CLAUDE_AUTOSTART:-1}
      - CLAUDE_CONFIG_DIR=/home/dev/.claude
    volumes:
      - ${PROJECTS_DIR:-./projects}:/work
      - ${SHARED_DIR:-./shared}:/shared
      - minimax-claude-home:/home/dev/.claude
      - minimax-cargo-home:/home/dev/.cargo
      - minimax-rustup-home:/home/dev/.rustup
      - minimax-bun-home:/home/dev/.bun
      - minimax-go-home:/usr/local/go
      - minimax-apt-cache:/var/cache/apt
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - AUDIT_WRITE
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-8g}
          cpus: "${CPU_LIMIT:-4.0}"
        reservations:
          memory: 2g
    restart: unless-stopped

volumes:
  minimax-claude-home:
  minimax-cargo-home:
  minimax-rustup-home:
  minimax-bun-home:
  minimax-go-home:
  minimax-apt-cache:
